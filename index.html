<!DOCTYPE html>

<body>
  <a class="skip-link" href="#app">Ir para o conteúdo</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="UpWord — página inicial">
      <svg class="brand-mark" width="30" height="30" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#1E8C82"/>
        <rect x="10" y="40" width="9" height="14" rx="2" fill="#F6F7F4"/>
        <rect x="23" y="30" width="9" height="24" rx="2" fill="#F6F7F4"/>
        <rect x="36" y="18" width="9" height="36" rx="2" fill="#F6F7F4"/>

      </svg>
      <span class="brand-name">UpWord</span>

    <nav class="topbar-nav" aria-label="Navegação principal">
      <a href="#/">Minha trilha</a>
      <a href="#/placement">Nivelamento</a>
      <a href="#/flashcards">Flashcards</a>
      <span class="prefs-controls">
        <button type="button" class="icon-toggle-btn font-size-btn" data-dir="dec" aria-label="Diminuir tamanho do texto">A-</button>
        <button type="button" class="icon-toggle-btn font-size-btn" data-dir="inc" aria-label="Aumentar tamanho do texto">A+</button>
        <button type="button" class="icon-toggle-btn" id="theme-toggle-btn" aria-label="Alternar tema claro/escuro">🌙</button>
      </span>
      <span class="points-pill" id="points-pill"><span aria-hidden="true">★</span> 0 pts</span>

  <footer class="footer">
    <p><strong>UpWord</strong> — 100% gratuito, sem cadastro. Seu progresso fica salvo apenas neste navegador.</p>

  <script src="js/icons.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* offline support unavailable, app still works online */ });
      });
    }
